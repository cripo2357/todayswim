# GitHub Pages — Pool's day 공개 문서 (약관·지원 페이지).
#
# 출시 시점 Privacy Policy URL / Support URL 확보용. 무료, public repo 필요.
# 활성화: GitHub repo > Settings > Pages > Source = Deploy from a branch,
#         Branch = main, Folder = /docs → Save.
#
# Live URL: https://cripo2357.github.io/todayswim/
#
# Privacy 관련 의도적 노출만 — 내부 작업 문서(SPEC / PROGRESS_LOG /
# WORKLOG / store-meta 등) 는 아래 exclude 로 빌드에서 제외 (단, repo
# 자체가 public 이면 git 차원에선 누구나 열람 가능 — 이건 별개 layer).

title: Pool's day
description: 동네 자유수영 수영장을 지도에서 찾고, 시간표를 확인하고, 수영 친구와 일정을 함께 잡는 앱.
url: https://cripo2357.github.io
baseurl: /todayswim
lang: ko-KR
author: CRIPO

# SEO — 검색 노출용 메타/OG 태그 + sitemap 자동 생성 (GitHub Pages 화이트리스트 플러그인).
# head-custom.html 의 {% seo %} 가 jekyll-seo-tag 출력을 head 에 주입.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# jekyll-seo-tag 기본 OG 이미지(페이지에 image 없을 때) + 트위터 카드.
# 경로는 baseurl 미포함 — 테마(사이드바)는 relative_url, seo-tag 는 absolute_url 로
# 각각 /todayswim 을 한 번만 붙임. 여기에 /todayswim 을 박으면 이중 접두(404)됨.
logo: /assets/og-image.png
twitter:
  card: summary

# 클린 URL — /terms/privacy-policy/ (확장자 없음, trailing slash).
permalink: pretty

# GitHub Pages 기본 테마 — minimal. 디자인 욕심 없으면 충분.
theme: jekyll-theme-minimal

markdown: kramdown
kramdown:
  input: GFM

# 공개 의도 없는 내부 작업 문서는 빌드 제외.
exclude:
  - SPEC.md
  - PROGRESS_LOG.md
  - WORKLOG.md
  - SUPABASE_SEOUL_MIGRATION.md
  - notification-triggers-spec-v0.5.md
  - pools-day-terms-input.md
  - terms-revision-push-infra.md
  - terms-revision-request.md
  - BIZ-INFO-FILL-CHECKLIST.md
  - P3-DEPLOY-CHECKLIST.md
  - P3-ENV-PROD-SETUP.md
  - P3-KAKAO-BIZ-SETUP.md
  - P3-EXTERNAL-CONSOLE-CHECKLIST.md
  - LAUNCH-LOG.md
  - app-store-submission-guide.md
  - store-meta/
  - "*.bak"
  - Gemfile
  - Gemfile.lock
  - vendor/
