<!-- Pool's day — SEO/OG 보강. jekyll-theme-minimal 이 head 에 include 하는 확장 지점.
     테마 default.html 이 이미 {% raw %}{% seo %}{% endraw %} 를 호출하므로(jekyll-seo-tag),
     여기서 다시 부르면 태그 중복 → 호출하지 않음. seo-tag 가 안 채우는
     og:image 절대경로·favicon·theme-color 만 보강. -->
<meta property="og:image" content="{{ '/assets/og-image.png' | absolute_url }}">
<meta name="twitter:image" content="{{ '/assets/og-image.png' | absolute_url }}">
<meta name="theme-color" content="#2563EB">
<link rel="icon" type="image/png" href="{{ '/assets/og-image.png' | absolute_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/og-image.png' | absolute_url }}">

<style>
  /* 사이드바 앱 아이콘 — 512px 원본을 적당히 줄이고 라운드 처리. */
  header img[alt="Logo"] {
    width: 88px;
    height: auto;
    border-radius: 20px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
  }

  /* 다운로드 뱃지 가로 정렬 — 랜딩 CTA.
     애플 뱃지(SVG)는 여백이 거의 없고, 구글 뱃지(PNG)는 위아래 23% 투명 여백이
     내장돼 있어 같은 height 로는 버튼 본체 크기가 안 맞음. 구글만 1.3배 키워
     본체를 맞추고, 늘어난 여백은 음수 마진으로 당겨 행 높이를 애플에 정렬. */
  .cta-badges { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .cta-badges img { width: auto; }
  .cta-badges img[alt*="App Store"] { height: 52px; }
  .cta-badges img[alt*="Google"]    { height: 68px; margin: -8px 0; }
</style>
